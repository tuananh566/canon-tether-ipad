workflows:
  build-ipa-unsigned:
    name: Build Canon Tether iOS IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate iOS native project (Prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Build App with Xcode (Unsigned)
        script: |
          cd ios
          pod install
          XCODEPROJ=$(ls -d *.xcodeproj | grep -v "Pods" | head -n 1)
          APP_NAME="${XCODEPROJ%.xcodeproj}"
          echo "Building Scheme: $APP_NAME"
          
          xcodebuild build \
            -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package .ipa
        script: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/DerivedData -name "*.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r CanonTether.ipa Payload

    artifacts:
      - build/CanonTether.ipa
