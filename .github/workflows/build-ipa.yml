name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods & Tools
        run: |
          sudo gem install cocoapods

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build App with Xcode (Unsigned)
        run: |
          cd ios
          pod install
          xcodebuild clean build \
            -workspace *.xcworkspace \
            -scheme "Canon Tether" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r CanonTether.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonTether-IPA
          path: build/CanonTether.ipa
          retention-days: 7
