name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build App with Xcode Archive
        run: |
          cd ios
          pod install
          
          # Tìm đúng tên project chính (loại trừ Pods)
          XCODEPROJ=$(ls -d *.xcodeproj | grep -v "Pods" | head -n 1)
          APP_NAME="${XCODEPROJ%.xcodeproj}"
          echo "Target App Name: $APP_NAME"
          
          cd ..
          mkdir -p build
          
          # Archive app chính xác 100%
          xcodebuild archive \
            -workspace "ios/$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/*.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r CanonTether.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonTether-IPA
          path: build/CanonTether.ipa
          retention-days: 7
