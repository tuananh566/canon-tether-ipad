name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build App with Xcode (Unsigned)
        run: |
          cd ios
          pod install
          
          # Lấy tên app thật
          XCODEPROJ=$(ls -d *.xcodeproj | grep -v "Pods" | head -n 1)
          APP_NAME="${XCODEPROJ%.xcodeproj}"
          echo "Building Scheme: $APP_NAME"
          
          # Dùng lệnh build thay vì archive để bỏ qua yêu cầu Apple Developer Team
          xcodebuild build \
            -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          
          # Tìm file .app đã được build trong thư mục Release-iphoneos
          APP_PATH=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/DerivedData -name "*.app" -type d | head -n 1)
          fi
          
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r CanonTether.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanonTether-IPA
          path: build/CanonTether.ipa
          retention-days: 7
